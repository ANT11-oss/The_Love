<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>我们的恋爱日记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pink:#ff6b9d;--pink-2:#ff9ec4;--pink-3:#ffe4ee;
  --purple:#b18cff;--text:#3d2b33;--muted:#9c8790;
  --card:#fff;--line:#ffe0ec;
  --shadow:0 6px 24px rgba(255,107,157,.13);
  --radius:20px;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(165deg,#fff6fa 0%,#ffeef6 35%,#f4efff 100%);
  background-attachment:fixed;color:var(--text);min-height:100vh;line-height:1.6;
  padding:16px 0 60px;
}
.bg-hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float-heart{position:absolute;bottom:-50px;animation:floatUp linear infinite;opacity:.45;user-select:none}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(360deg)}}

.app{max-width:780px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

/* ---------- 顶部 ---------- */
.hero{
  background:linear-gradient(135deg,#ffa9c9 0%,#ff6b9d 48%,#b18cff 100%);
  border-radius:32px;padding:34px 22px 30px;text-align:center;color:#fff;
  box-shadow:0 14px 40px rgba(255,107,157,.28);position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.13);top:-110px;right:-70px}
.hero::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.10);bottom:-80px;left:-50px}
.names{font-size:19px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:1}
.hero-heart{animation:beat 1.4s ease-in-out infinite;display:inline-block;font-size:20px}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.counter{margin-top:14px;position:relative;z-index:1;display:flex;align-items:baseline;justify-content:center;gap:6px}
.counter-num{font-size:60px;font-weight:800;line-height:1;letter-spacing:-2px;
  font-variant-numeric:tabular-nums;text-shadow:0 4px 16px rgba(0,0,0,.12)}
.counter-unit{font-size:17px;opacity:.95}
.counter-sub{margin-top:8px;font-size:13.5px;opacity:.9;position:relative;z-index:1}

/* ---------- 标签栏 ---------- */
.tabs{display:flex;gap:6px;margin:18px 0;background:#fff;padding:7px;border-radius:18px;
  box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 12px;border:none;background:transparent;border-radius:13px;
  cursor:pointer;font-size:14px;color:var(--muted);font-family:inherit;white-space:nowrap;transition:.22s}
.tab.active{background:linear-gradient(135deg,var(--pink-2),var(--pink));color:#fff;
  box-shadow:0 6px 16px rgba(255,107,157,.35);font-weight:600}

/* ---------- 面板 ---------- */
.panel{display:none}
.panel.active{display:block;animation:fadeUp .32s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
  margin-bottom:15px;border:1px solid rgba(255,224,236,.85)}
.card-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.count{font-size:12px;font-weight:500;color:var(--muted);background:#fdf1f6;padding:2px 10px;border-radius:20px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:16px 0}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.tip{background:linear-gradient(135deg,#fff5f9,#fdf0ff);color:var(--pink);
  font-size:14px;text-align:center;border:1px dashed #ffc6dd}

/* 下一个纪念日 */
.next-card{background:linear-gradient(135deg,#fff2f7,#f7f0ff);border:1px solid #ffdcea;text-align:center}
.next-label{font-size:12.5px;color:var(--muted);letter-spacing:1px}
.next-title{font-size:21px;font-weight:800;margin:6px 0 2px;
  background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.next-meta{font-size:13px;color:var(--muted)}
.next-count{margin-top:10px;font-size:15px;color:var(--text)}
.next-count b{font-size:24px;color:var(--pink);font-weight:800}

/* 迷你日记 */
.mini-diary{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.mini-diary:last-of-type{border-bottom:none}
.mini-mood{font-size:24px;flex:none}
.mini-title{font-size:14.5px;font-weight:600}
.mini-date{font-size:12px;color:var(--muted)}

/* 纪念日条目 */
.anniv-item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.anniv-item:last-child{border-bottom:none}
.anniv-badge{flex:none;width:52px;height:52px;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:linear-gradient(135deg,#fff0f6,#ffe0ee);
  color:var(--pink);font-weight:800;font-size:18px;line-height:1.1}
.anniv-badge small{font-size:10px;font-weight:500;color:var(--muted)}
.anniv-badge.past{background:#f5f3f6;color:#bdb4b9}
.anniv-main{flex:1;min-width:0}
.anniv-name{font-size:15px;font-weight:600;word-break:break-word}
.anniv-meta{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:break-word}
.anniv-actions{display:flex;gap:6px;flex:none}
.icon-btn{width:32px;height:32px;border-radius:10px;border:none;background:#fdf1f6;color:var(--muted);
  cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.2s}
.icon-btn:hover{background:#ffe0ee;color:var(--pink)}

/* 日记条目 */
.diary-item{padding:16px 0;border-bottom:1px dashed var(--line)}
.diary-item:last-child{border-bottom:none}
.diary-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.diary-mood{font-size:22px}
.diary-title{font-weight:700;font-size:15.5px;flex:1;word-break:break-word}
.diary-date{font-size:12px;color:var(--muted);flex:none}
.diary-content{font-size:14.5px;color:#5c4a52;white-space:pre-wrap;word-break:break-word}
.diary-content.clamped{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.diary-more{font-size:13px;color:var(--pink);cursor:pointer;margin-top:6px;user-select:none;font-weight:600}

/* 相册 */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.photo-item{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#f7f3f5;cursor:pointer}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
.photo-item:hover img{transform:scale(1.06)}
.photo-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:none;
  background:rgba(0,0,0,.45);color:#fff;font-size:11px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;backdrop-filter:blur(4px)}

/* 表单 */
.field{display:block;margin-bottom:15px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:600}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border:1.5px solid #f3e3ea;border-radius:13px;
  font-size:15px;font-family:inherit;color:var(--text);background:#fdfafc;
  outline:none;transition:.2s;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--pink-2);background:#fff;box-shadow:0 0 0 4px rgba(255,158,196,.16)}

/* 心情选择 */
.mood-picker{display:flex;flex-wrap:wrap;gap:8px}
.mood-opt{width:44px;height:44px;border-radius:13px;border:1.5px solid #f3e3ea;background:#fdfafc;
  font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s}
.mood-opt.sel{border-color:var(--pink);background:#fff0f6;transform:scale(1.08);
  box-shadow:0 4px 12px rgba(255,107,157,.22)}

/* 按钮 */
.btn{border:none;border-radius:14px;padding:12px 20px;font-size:15px;cursor:pointer;
  font-family:inherit;font-weight:600;transition:.2s}
.btn-primary{background:linear-gradient(135deg,var(--pink-2),var(--pink));color:#fff;
  box-shadow:0 6px 18px rgba(255,107,157,.34)}
.btn-primary:active{transform:scale(.975)}
.btn-ghost{background:#f5f0f3;color:var(--muted)}
.btn-danger{background:#fff0f3;color:#e8467c}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(60,30,45,.42);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;
  opacity:0;pointer-events:none;transition:.25s}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:24px;width:100%;max-width:420px;max-height:86vh;
  display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(120,40,80,.3);
  transform:translateY(16px) scale(.97);transition:.25s}
.modal-mask.show .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px}
.modal-head h3{font-size:17px}
.modal-close{border:none;background:#f7f0f4;width:30px;height:30px;border-radius:50%;
  cursor:pointer;color:var(--muted);font-size:13px}
.modal-body{padding:6px 22px 8px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;padding:14px 22px 20px}
.modal-foot .btn{flex:1}

/* 图片预览 */
.lightbox{position:fixed;inset:0;background:rgba(20,10,15,.9);display:flex;align-items:center;
  justify-content:center;z-index:200;padding:20px;opacity:0;pointer-events:none;transition:.25s}
.lightbox.show{opacity:1;pointer-events:auto}
.lightbox img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain}

@media(max-width:400px){
  .counter-num{font-size:50px}
  .hero{padding:28px 18px 24px;border-radius:26px}
  .card{padding:17px}
}
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<div class="app">
  <header class="hero">
    <div class="names">
      <span id="heroMe">我</span>
      <span class="hero-heart">❤</span>
      <span id="heroPartner">TA</span>
    </div>
    <div class="counter">
      <span class="counter-num" id="daysCount">—</span>
      <span class="counter-unit">天</span>
    </div>
    <p class="counter-sub" id="startDateText">还没有设置开始日期</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="home">🏠 首页</button>
    <button class="tab" data-tab="anniversary">🎂 纪念日</button>
    <button class="tab" data-tab="diary">📖 日记</button>
    <button class="tab" data-tab="album">📷 相册</button>
    <button class="tab" data-tab="settings">⚙️ 设置</button>
  </nav>

  <main>
    <section class="panel active" id="panel-home"></section>
    <section class="panel" id="panel-anniversary"></section>
    <section class="panel" id="panel-diary"></section>
    <section class="panel" id="panel-album"></section>
    <section class="panel" id="panel-settings"></section>
  </main>
</div>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalConfirm">保存</button>
    </div>
  </div>
</div>

<!-- 图片预览 -->
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<script>
/* =========================================================
   恋爱日记 · 核心脚本
   数据结构：
   settings      { me, partner, startDate }
   anniversaries [{ id, title, date, repeat, note }]
   diaries       [{ id, date, mood, title, content }]
   photos        [{ id, date, caption, src }]
   ========================================================= */

const KEY = 'loveJournal_v1';

const DEFAULT = {
  settings: { me: '我', partner: 'TA', startDate: '' },
  anniversaries: [],
  diaries: [],
  photos: []
};

/* ---------- 工具函数 ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(str){
  if (str instanceof Date) return str;
  const [y, m, d] = String(str).split('-').map(Number);
  return new Date(y, m - 1, d);
}
function todayStart(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function daysBetween(a, b){
  const A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}
function fmtDate(d){
  if (typeof d === 'string') d = parseDate(d);
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${w}`;
}
function fmtDateShort(d){
  if (typeof d === 'string') d = parseDate(d);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

/* ---------- 数据读写 ---------- */
let data;
try {
  const raw = localStorage.getItem(KEY);
  data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT));
} catch (e) {
  data = JSON.parse(JSON.stringify(DEFAULT));
}
// 结构补全，防止旧数据缺字段
data.settings      = Object.assign({}, DEFAULT.settings, data.settings || {});
data.anniversaries = Array.isArray(data.anniversaries) ? data.anniversaries : [];
data.diaries       = Array.isArray(data.diaries)       ? data.diaries       : [];
data.photos        = Array.isArray(data.photos)        ? data.photos        : [];

function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    alert('保存失败：浏览器本地空间已满。\n可以删掉一些照片，或用「设置 → 导出数据」备份后清理。');
    return false;
  }
}

/* ---------- 计算逻辑 ---------- */
function getDaysTogether(){
  if (!data.settings.startDate) return null;
  const d = daysBetween(parseDate(data.settings.startDate), todayStart());
  return d < 0 ? null : d + 1;   // 包含第一天
}

function calcAnniv(a){
  const today = todayStart();
  const base  = parseDate(a.date);
  if (a.repeat === 'yearly') {
    let next = new Date(today.getFullYear(), base.getMonth(), base.getDate());
    if (next < today) next = new Date(today.getFullYear() + 1, base.getMonth(), base.getDate());
    return { next, diff: daysBetween(today, next), yearly: true, passed: false };
  }
  const diff = daysBetween(today, base);
  return { next: base, diff, yearly: false, passed: diff < 0 };
}

function getNextAnniversary(){
  if (!data.anniversaries.length) return null;
  let best = null;
  for (const a of data.anniversaries) {
    const c = calcAnniv(a);
    if (c.passed) continue;
    if (!best || c.diff < best.diff) best = { ...a, ...c };
  }
  return best;
}

/* =========================================================
   渲染层
   ========================================================= */

function renderHero(){
  const s = data.settings;
  $('#heroMe').textContent      = s.me || '我';
  $('#heroPartner').textContent = s.partner || 'TA';
  const days = getDaysTogether();
  $('#daysCount').textContent = days === null ? '—' : days;
  $('#startDateText').textContent = s.startDate
    ? `从 ${fmtDateShort(s.startDate)} 开始`
    : '去「设置」里填写你们开始的日子吧';
}

/* ---- 首页 ---- */
function renderHome(){
  const next   = getNextAnniversary();
  const recent = [...data.diaries].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
  let html = '';

  if (!data.settings.startDate) {
    html += `<div class="card tip">💡 先去「设置」里填写你们开始的日子吧～</div>`;
  }

  if (next) {
    html += `
      <div class="card next-card">
        <div class="next-label">下一个纪念日</div>
        <div class="next-title">${esc(next.title)}</div>
        <div class="next-meta">${fmtDate(next.next)}${next.yearly ? ' · 每年' : ''}</div>
        <div class="next-count">${next.diff === 0
          ? '🎉 <b>就是今天！</b>'
          : `还有 <b>${next.diff}</b> 天`}</div>
      </div>`;
  } else {
    html += `<div class="card tip">还没有纪念日，去添加一个吧 🎂</div>`;
  }

  html += `
    <div class="card">
      <div class="card-title">最近的心情记录</div>
      ${recent.length
        ? recent.map(d => `
          <div class="mini-diary">
            <span class="mini-mood">${d.mood || '💭'}</span>
            <div>
              <div class="mini-title">${esc(d.title || '无标题')}</div>
              <div class="mini-date">${fmtDateShort(d.date)}</div>
            </div>
          </div>`).join('')
        : `<p class="empty">还没有记录，去写下第一条吧 ✍️</p>`}
      <button class="btn btn-primary btn-block" style="margin-top:14px"
        onclick="openDiaryForm()">✍️ 记录今天</button>
    </div>`;

  $('#panel-home').innerHTML = html;
}

/* ---- 纪念日 ---- */
function renderAnniversaries(){
  const list = data.anniversaries
    .map(a => ({ ...a, ...calcAnniv(a) }))
    .sort((a, b) => {
      if (a.passed !== b.passed) return a.passed ? 1 : -1;
      return a.passed ? b.diff - a.diff : a.diff - b.diff;
    });

  let html = `
    <div class="card">
      <div class="card-title">
        <span>🎂 我们的纪念日</span>
        <span class="count">${list.length} 个</span>
      </div>
      <button class="btn btn-primary btn-block" onclick="openAnnivForm()">＋ 添加纪念日</button>
    </div>`;

  if (list.length) {
    html += `<div class="card">` + list.map(a => {
      const badge = a.passed
        ? `<div class="anniv-badge past">${Math.abs(a.diff)}<small>天前</small></div>`
        : a.diff === 0
          ? `<div class="anniv-badge">今<small>天</small></div>`
          : `<div class="anniv-badge">${a.diff}<small>天后</small></div>`;
      return `
        <div class="anniv-item">
          ${badge}
          <div class="anniv-main">
            <div class="anniv-name">${esc(a.title)}</div>
            <div class="anniv-meta">
              ${fmtDate(a.date)}${a.yearly ? ' · 每年' : ' · 一次性'}
              ${a.note ? '<br>' + esc(a.note) : ''}
            </div>
          </div>
          <div class="anniv-actions">
            <button class="icon-btn" onclick="openAnnivForm('${a.id}')">✏️</button>
            <button class="icon-btn" onclick="delAnniv('${a.id}')">🗑</button>
          </div>
        </div>`;
    }).join('') + `</div>`;
  } else {
    html += `<div class="card"><p class="empty">还没有纪念日，点上面添加一个吧 🎂</p></div>`;
  }

  $('#panel-anniversary').innerHTML = html;
}

/* ---- 日记 ---- */
function renderDiaries(){
  const list = [...data.diaries].sort((a, b) => b.date.localeCompare(a.date));

  let html = `
    <div class="card">
      <div class="card-title">
        <span>📖 恋爱日记</span>
        <span class="count">${list.length} 篇</span>
      </div>
      <button class="btn btn-primary btn-block" onclick="openDiaryForm()">✍️ 写一篇</button>
    </div>`;

  if (list.length) {
    html += `<div class="card">` + list.map(d => `
      <div class="diary-item">
        <div class="diary-head">
          <span class="diary-mood">${d.mood || '💭'}</span>
          <span class="diary-title">${esc(d.title || '无标题')}</span>
          <span class="diary-date">${fmtDateShort(d.date)}</span>
        </div>
        <div class="diary-content clamped" id="dc-${d.id}">${esc(d.content)}</div>
        <div class="diary-more" data-toggle="${d.id}">展开全文 ▾</div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn btn-ghost" style="padding:8px;font-size:13px"
            onclick="openDiaryForm('${d.id}')">编辑</button>
          <button class="btn btn-danger" style="padding:8px;font-size:13px"
            onclick="delDiary('${d.id}')">删除</button>
        </div>
      </div>`).join('') + `</div>`;
  } else {
    html += `<div class="card"><p class="empty">还没有日记，写下第一件小事吧 ✍️</p></div>`;
  }

  $('#panel-diary').innerHTML = html;

  // 展开/收起
  $$('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const el = document.getElementById('dc-' + btn.dataset.toggle);
      if (!el) return;
      const clamped = el.classList.toggle('clamped');
      btn.textContent = clamped ? '展开全文 ▾' : '收起 ▴';
    });
  });
}

/* ---- 相册 ---- */
function renderPhotos(){
  const list = [...data.photos].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  let html = `
    <div class="card">
      <div class="card-title">
        <span>📷 我们的相册</span>
        <span class="count">${list.length} 张</span>
      </div>
      <p class="hint">照片保存在浏览器本地，换设备或清缓存会丢失，重要的记得备份～</p>
      <button class="btn btn-primary btn-block" id="btnUpload" style="margin-top:12px">＋ 上传照片</button>
      <input type="file" id="photoInput" accept="image/*" multiple hidden>
    </div>`;

  if (list.length) {
    html += `<div class="card"><div class="photo-grid">` + list.map(p => `
      <div class="photo-item" data-view="${p.id}">
        <img src="${p.src}" alt="" loading="lazy">
        <button class="photo-del" data-del="${p.id}">✕</button>
      </div>`).join('') + `</div></div>`;
  } else {
    html += `<div class="card"><p class="empty">还没有照片，上传第一张吧 📸</p></div>`;
  }

  $('#panel-album').innerHTML = html;

  // 上传
  const input = $('#photoInput');
  $('#btnUpload').addEventListener('click', () => input.click());
  input.addEventListener('change', async e => {
    const files = [...e.target.files];
    if (!files.length) return;
    if (data.photos.length + files.length > 80) {
      if (!confirm('照片较多，本地存储可能吃不消，确定继续吗？')) return;
    }
    for (const f of files) {
      if (!f.type.startsWith('image/')) continue;
      try {
        const src = await compressImage(f);
        data.photos.push({ id: uid(), date: todayStr(), caption: '', src });
      } catch (err) { console.warn('图片处理失败', err); }
    }
    if (save()) renderPhotos();
  });

  // 删除
  $$('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm('确定删除这张照片吗？')) return;
      data.photos = data.photos.filter(p => p.id !== btn.dataset.del);
      save(); renderPhotos();
    });
  });

  // 预览
  $$('[data-view]').forEach(el => {
    el.addEventListener('click', () => {
      const p = data.photos.find(x => x.id === el.dataset.view);
      if (!p) return;
      $('#lightboxImg').src = p.src;
      $('#lightbox').classList.add('show');
    });
  });
}

/* ---- 设置 ---- */
function renderSettings(){
  const s = data.settings;
  $('#panel-settings').innerHTML = `
    <div class="card">
      <div class="card-title">💕 基本信息</div>
      <label class="field"><span>我的名字</span>
        <input id="s_me" value="${esc(s.me)}" placeholder="我"></label>
      <label class="field"><span>TA 的名字</span>
        <input id="s_partner" value="${esc(s.partner)}" placeholder="TA"></label>
      <label class="field"><span>在一起的第一天</span>
        <input type="date" id="s_date" value="${esc(s.startDate)}"></label>
      <button class="btn btn-primary btn-block" id="saveSettings">保存设置</button>
    </div>

    <div class="card">
      <div class="card-title">🗂 数据管理</div>
      <p class="hint" style="margin-bottom:14px">
        数据保存在当前浏览器中。换设备前请先导出备份。
      </p>
      <div class="btn-row" style="margin-bottom:10px">
        <button class="btn btn-ghost" id="btnExport">⬇️ 导出数据</button>
        <button class="btn btn-ghost" id="btnImport">⬆️ 导入数据</button>
      </div>
      <input type="file" id="importInput" accept=".json,application/json" hidden>
      <button class="btn btn-danger btn-block" id="btnClear">清空所有数据</button>
    </div>

    <div class="card" style="text-align:center;color:var(--muted);font-size:12.5px">
      用 ❤️ 记录每一个平凡又珍贵的日子
    </div>`;

  $('#saveSettings').addEventListener('click', () => {
    data.settings.me        = $('#s_me').value.trim() || '我';
    data.settings.partner   = $('#s_partner').value.trim() || 'TA';
    data.settings.startDate = $('#s_date').value;
    if (save()) { renderHero(); renderHome(); alert('已保存 ✓'); }
  });

  $('#btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `恋爱日记备份_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('#btnImport').addEventListener('click', () => $('#importInput').click());
  $('#importInput').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const obj = JSON.parse(ev.target.result);
        if (!obj.settings && !obj.diaries && !obj.anniversaries) throw new Error('文件格式不正确');
        if (!confirm('导入会覆盖当前数据，确定继续吗？')) return;
        data = {
          settings: Object.assign({}, DEFAULT.settings, obj.settings || {}),
          anniversaries: obj.anniversaries || [],
          diaries: obj.diaries || [],
          photos: obj.photos || []
        };
        save(); renderAll();
        alert('导入成功 ✓');
      } catch (err) { alert('导入失败：' + err.message); }
    };
    reader.readAsText(f);
  });

  $('#btnClear').addEventListener('click', () => {
    if (!confirm('确定清空所有数据吗？此操作不可恢复！')) return;
    if (!confirm('再次确认：真的要删除全部记录吗？')) return;
    data = JSON.parse(JSON.stringify(DEFAULT));
    localStorage.removeItem(KEY);
    renderAll();
    alert('已清空');
  });
}

/* =========================================================
   表单 / 弹窗交互
   ========================================================= */

let modalConfirmHandler = null;

function openModal({ title, body, confirmText = '保存', hideConfirm = false, onConfirm }){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  const confirmBtn = $('#modalConfirm');
  confirmBtn.textContent = confirmText;
  confirmBtn.style.display = hideConfirm ? 'none' : '';
  modalConfirmHandler = onConfirm;
  $('#modalMask').classList.add('show');
}
function closeModal(){
  $('#modalMask').classList.remove('show');
  modalConfirmHandler = null;
}
$('#modalClose').addEventListener('click', closeModal);
$('#modalCancel').addEventListener('click', closeModal);
$('#modalConfirm').addEventListener('click', () => {
  if (modalConfirmHandler && modalConfirmHandler() === false) return;
  closeModal();
});
$('#modalMask').addEventListener('click', e => {
  if (e.target === $('#modalMask')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); $('#lightbox').classList.remove('show'); }
});

/* ---- 纪念日表单 ---- */
function openAnnivForm(id){
  const item = id ? data.anniversaries.find(a => a.id === id) : null;
  openModal({
    title: item ? '编辑纪念日' : '添加纪念日',
    body: `
      <label class="field"><span>名称</span>
        <input id="f_title" placeholder="例如：我们的第一次约会"
          value="${item ? esc(item.title) : ''}"></label>
      <label class="field"><span>日期</span>
        <input type="date" id="f_date" value="${item ? item.date : todayStr()}"></label>
      <label class="field"><span>类型</span>
        <select id="f_repeat">
          <option value="yearly" ${!item || item.repeat === 'yearly' ? 'selected' : ''}>每年重复</option>
          <option value="once" ${item && item.repeat === 'once' ? 'selected' : ''}>只此一次</option>
        </select></label>
      <label class="field"><span>备注（可选）</span>
        <textarea id="f_note" rows="2"
          placeholder="想说的话…">${item ? esc(item.note || '') : ''}</textarea></label>
    `,
    onConfirm: () => {
      const title = $('#f_title').value.trim();
      const date  = $('#f_date').value;
      if (!title) { alert('请填写名称'); return false; }
      if (!date)  { alert('请选择日期'); return false; }
      const obj = {
        title, date,
        repeat: $('#f_repeat').value,
        note: $('#f_note').value.trim()
      };
      if (item) Object.assign(item, obj);
      else data.anniversaries.push({ id: uid(), ...obj });
      save(); renderAnniversaries(); renderHome();
    }
  });
  setTimeout(() => $('#f_title')?.focus(), 120);
}

function delAnniv(id){
  if (!confirm('确定删除这个纪念日吗？')) return;
  data.anniversaries = data.anniversaries.filter(a => a.id !== id);
  save(); renderAnniversaries(); renderHome();
}

/* ---- 日记表单 ---- */
const MOODS = ['🥰','😊','😍','😌','🤗','🥲','😭','😤','🤔','😴','🎉','💭'];

function openDiaryForm(id){
  const item = id ? data.diaries.find(d => d.id === id) : null;
  const curMood = item ? (item.mood || '💭') : '🥰';

  openModal({
    title: item ? '编辑日记' : '写一篇日记',
    body: `
      <label class="field"><span>日期</span>
        <input type="date" id="d_date" value="${item ? item.date : todayStr()}"></label>
      <div class="field"><span>今天的心情</span>
        <div class="mood-picker" id="moodPicker">
          ${MOODS.map(m => `<button type="button" class="mood-opt ${m === curMood ? 'sel' : ''}"
            data-mood="${m}">${m}</button>`).join('')}
        </div>
      </div>
      <label class="field"><span>标题</span>
        <input id="d_title" placeholder="今天发生了什么？"
          value="${item ? esc(item.title) : ''}"></label>
      <label class="field"><span>内容</span>
        <textarea id="d_content" rows="6"
          placeholder="写下你们的点点滴滴…">${item ? esc(item.content) : ''}</textarea></label>
    `,
    onConfirm: () => {
      const date    = $('#d_date').value;
      const title   = $('#d_title').value.trim();
      const content = $('#d_content').value.trim();
      const mood    = $('#moodPicker .sel')?.dataset.mood || '💭';
      if (!date) { alert('请选择日期'); return false; }
      if (!title && !content) { alert('写点什么吧～'); return false; }
      const obj = { date, title, content, mood };
      if (item) Object.assign(item, obj);
      else data.diaries.push({ id: uid(), ...obj });
      save(); renderDiaries(); renderHome();
    }
  });

  // 心情选择
  setTimeout(() => {
    $$('#moodPicker .mood-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('#moodPicker .mood-opt').forEach(b => b.classList.remove('sel'));
        btn.classList.add('sel');
      });
    });
    $('#d_title')?.focus();
  }, 120);
}

function delDiary(id){
  if (!confirm('确定删除这篇日记吗？')) return;
  data.diaries = data.diaries.filter(d => d.id !== id);
  save(); renderDiaries(); renderHome();
}

/* =========================================================
   图片压缩 & 预览
   ========================================================= */
function compressImage(file, maxSize = 1100, quality = 0.78){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          const r = Math.min(maxSize / width, maxSize / height);
          width  = Math.round(width * r);
          height = Math.round(height * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

$('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('show'));

/* =========================================================
   标签切换 & 总渲染
   ========================================================= */
function renderPanel(name){
  switch (name) {
    case 'home':        renderHome(); break;
    case 'anniversary': renderAnniversaries(); break;
    case 'diary':       renderDiaries(); break;
    case 'album':       renderPhotos(); break;
    case 'settings':    renderSettings(); break;
  }
}

function renderAll(){
  renderHero();
  const active = $('.tab.active')?.dataset.tab || 'home';
  renderPanel(active);
}

$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t => t.classList.remove('active'));
    $$('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    document.getElementById('panel-' + name).classList.add('active');
    renderPanel(name);
  });
});

/* ---------- 背景爱心 ---------- */
(function spawnHearts(){
  const box = $('#bgHearts');
  const chars = ['💗','💕','💖','🌸','✨','💞'];
  for (let i = 0; i < 16; i++) {
    const h = document.createElement('div');
    h.className = 'float-heart';
    h.textContent = chars[i % chars.length];
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = (12 + Math.random() * 16) + 'px';
    h.style.animationDuration = (14 + Math.random() * 14) + 's';
    h.style.animationDelay = (-Math.random() * 24) + 's';
    box.appendChild(h);
  }
})();

/* ---------- 启动 ---------- */
renderAll();
</script>
